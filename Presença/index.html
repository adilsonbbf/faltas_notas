<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafeteria Aroma</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-amber-100 to-orange-50 min-h-screen flex flex-col items-center justify-center px-4">

  <!-- Cabeçalho -->
  <header class="text-center mb-8">
    <h1 class="text-4xl font-bold text-brown-800 mb-2">Cafeteria Aroma</h1>
    <p class="text-lg text-gray-700">Sabor e aconchego em cada xícara</p>
  </header>

  <!-- Conteúdo principal -->
  <main class="bg-white shadow-lg rounded-2xl p-6 max-w-md w-full text-center">
    <img 
      src="https://images.unsplash.com/photo-1509042239860-f550ce710b93" 
      alt="Café quente" 
      class="w-full h-56 object-cover rounded-xl mb-4"
    />
    <p class="text-gray-600 mb-6">
      Bem-vindo à Cafeteria Aroma! Servimos cafés especiais, doces artesanais e momentos inesquecíveis. Visite-nos e sinta o verdadeiro aroma do aconchego.
    </p>
    <a 
      href="#"
      class="inline-block bg-amber-600 hover:bg-amber-700 text-white font-semibold py-2 px-6 rounded-full transition duration-300"
    >
      Fazer Pedido
    </a>
  </main>

  <!-- Rodapé opcional -->
  <footer class="mt-10 text-gray-500 text-sm">
    © 2025 Cafeteria Aroma. Todos os direitos reservados.
  </footer>

</body>
</html>
