<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema Escolar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

  <!-- Cabeçalho -->
  <header class="bg-blue-600 text-white py-6 shadow-md">
    <div class="container mx-auto text-center">
      <h1 class="text-3xl font-bold">Sistema Escolar</h1>
      <p class="text-lg">Inserção de Notas e Faltas</p>
    </div>
  </header>

  <!-- Formulário -->
  <main class="container mx-auto mt-10 px-4">
    <section class="bg-white p-6 rounded-lg shadow-md max-w-xl mx-auto">
      <h2 class="text-2xl font-semibold mb-6 text-gray-700 text-center">Formulário do Aluno</h2>

      <form class="space-y-5">
        <div>
          <label for="nome" class="block font-medium text-gray-700 mb-1">Nome do Aluno</label>
          <input type="text" id="nome" name="nome" required
            class="w-full border border-gray-300 p-2 rounded-md focus:outline-none focus:ring focus:ring-blue-200">
        </div>

        <div>
          <label for="disciplina" class="block font-medium text-gray-700 mb-1">Disciplina</label>
          <input type="text" id="disciplina" name="disciplina" required
            class="w-full border border-gray-300 p-2 rounded-md focus:outline-none focus:ring focus:ring-blue-200">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="nota" class="block font-medium text-gray-700 mb-1">Nota</label>
            <input type="number" id="nota" name="nota" min="0" max="10" required
              class="w-full border border-gray-300 p-2 rounded-md focus:outline-none focus:ring focus:ring-blue-200">
          </div>

          <div>
            <label for="faltas" class="block font-medium text-gray-700 mb-1">Faltas</label>
            <input type="number" id="faltas" name="faltas" min="0" required
              class="w-full border border-gray-300 p-2 rounded-md focus:outline-none focus:ring focus:ring-blue-200">
          </div>
        </div>

        <button type="submit"
          class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-md hover:bg-blue-700 transition">
          Salvar Dados
        </button>
      </form>
    </section>
  </main>

  <!-- Rodapé opcional -->
  <footer class="text-center text-gray-500 text-sm mt-10">
    © 2025 Sistema Escolar. Todos os direitos reservados.
  </footer>

</body>
</html>
